apiVersion: machinelearning.seldon.io/v1
kind: SeldonDeployment
metadata:
  labels:
    app: seldon
  name: {{ svc_name }}
  namespace: ml-workshop
spec:
  annotations:
    project_name: "{{ model_name }}"
    deployment_version: "{{ experiment_id }}"
  name: {{ clean_model_name }}-specs
  predictors:
    - componentSpecs:
        - spec:
            containers:
              - image: {{ model_coordinates }}
                imagePullPolicy: Always
                name: predictor
                env:
                  - name: MODEL_NAME
                    value: "Predictor"
                  - name: SERVICE_TYPE
                    value: MODEL
                  - name: HTTP_PORT
                    value: "9000"
                  - name: METRICS_PORT
                    value: "6000"
                  - name: GRPC_PORT
                    value: "5000"
                  - name: MODEL_WEIGHTS_PATH
                    value: "/microservice/best.pt"
                resources:
                  requests:
                    memory: "512Mi"
                    cpu: "200m"
                  limits:
                    memory: "2500Mi"
                    cpu: "1500m"
      graph:
        name: predictor
        type: MODEL
        endpoint:
          type: REST
          service_host: localhost
          service_port: 9000
      name: {{ clean_model_name }}
      annotations:
        predictor_version: "{{ experiment_id }}"
        team: opendatahub
        seldon.io/svc-name: {{ svc_name }}
      labels:
        team: opendatahub
        version: v1
        app.kubernetes.io/managed-by: seldon-core
      replicas: 1
